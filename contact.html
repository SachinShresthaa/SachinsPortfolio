      <!-- ════ FORM SIDE ════ -->
      <div class="form-side" id="form-side">

        <span class="f-eyebrow">Send a message</span>

        <form class="c-form" id="contactForm" novalidate>

          <div class="f-row">
            <div class="f-field">
              <label for="f-name">Name</label>
              <input type="text" id="f-name" name="name" placeholder="Sachin Shrestha" autocomplete="off" />
            </div>
            <div class="f-field">
              <label for="f-email">Email</label>
              <input type="email" id="f-email" name="email" placeholder="hello@example.com" autocomplete="off" />
            </div>
          </div>

          <div class="f-field">
            <label for="f-subject">Subject</label>
            <input type="text" id="f-subject" name="subject" placeholder="What's this about?" autocomplete="off" />
          </div>

          <div class="f-field">
            <label for="f-message">Message</label>
            <textarea id="f-message" name="message" rows="5" placeholder="Hi Sachin, I'd love to…"></textarea>
          </div>

          <div class="f-actions">
            <button type="submit" class="f-submit">
              Send Message
              <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
            <span class="f-note">I'll reply within 24h</span>
          </div>

          <p class="f-success" id="f-success">
            ✓ &nbsp;Message sent — I'll get back to you soon.
          </p>

        </form>

      </div>

  <!-- shared header (cursor + hover-bar + nav) -->

  <!-- shared page transition -->
  <script src="js/transition.js"></script>

  <script>
    /* ── page reveals ── */
    function reveal(id, delay) {
      setTimeout(() => {
        const el = document.getElementById(id);
        if (el) el.classList.add('visible');
      }, delay);
    }
    reveal('nav-logo',      900);
    reveal('nav-left',     900);
    reveal('nav-right',    900);
    reveal('contact-side',  900);
    reveal('form-side',    1050);

    /* ── form submit (visual only — wire to a service like Formspree / EmailJS) ── */
    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name    = this.name.value.trim();
      const email   = this.email.value.trim();
      const message = this.elements['message'].value.trim();
      if (!name || !email || !message) return;

      /* swap button state */
      const btn = this.querySelector('.f-submit');
      btn.textContent = 'Sending…';
      btn.style.opacity = '0.6';
      btn.disabled = true;

      /* simulate send (replace with actual service call) */
      setTimeout(() => {
        this.reset();
        btn.style.display = 'none';
        this.querySelector('.f-note').style.display = 'none';
        document.getElementById('f-success').classList.add('show');
      }, 1200);
    });
  </script>
