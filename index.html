<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sachin Shrestha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/index.css" />
</head>
<body>

  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <!-- HOVER BAR — splits open from center -->
  <div id="hover-bar">
    <div class="bar-top"></div>
    <span id="hover-bar-text"></span>
    <div class="bar-bot"></div>
  </div>

  <!-- NAV -->
  <nav id="navbar">
    <ul class="nav-left" id="nav-left">
      <li><a href="#about" data-label="Skills">Skills</a></li>
      <span class="dot"></span>
      <li><a href="#work" data-label="Experience">Experience</a></li>
    </ul>
    <div class="nav-logo" id="nav-logo" data-label="Home">
      <img src="assets/logo.png" alt="SS" />
    </div>
    <ul class="nav-right" id="nav-right">
      <li><a href="#shop" data-label="Projects">Projects</a></li>
      <span class="dot"></span>
      <li><a href="#contact" data-label="Contact">Contact</a></li>
    </ul>
  </nav>

  <!-- HERO -->
  <section class="hero">

    <span class="name-word name-sachin" id="name-sachin">SACHIN</span>

    <div class="hero-image-wrap" id="hero-photo">
      <img src="assets/pp.png" alt="Sachin Shrestha" />
    </div>

    <span class="name-word name-shrestha" id="name-shrestha">SHRESTHA</span>

  </section>

  <script>
    /* ── Cursor ── */
    const dot  = document.getElementById('cursor-dot');
    const ring = document.getElementById('cursor-ring');
    let mx=0, my=0, rx=0, ry=0;

    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      dot.style.left = mx + 'px';
      dot.style.top  = my + 'px';
    });
    (function raf() {
      rx += (mx - rx) * 0.1;
      ry += (my - ry) * 0.1;
      ring.style.left = rx + 'px';
      ring.style.top  = ry + 'px';
      requestAnimationFrame(raf);
    })();
    document.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('mouseenter', () => {
        dot.style.transform = 'translate(-50%,-50%) scale(2.5)';
        ring.style.width    = '52px';
        ring.style.height   = '52px';
      });
      el.addEventListener('mouseleave', () => {
        dot.style.transform = 'translate(-50%,-50%) scale(1)';
        ring.style.width    = '34px';
        ring.style.height   = '34px';
      });
    });

    /* ── Scroll nav ── */
    window.addEventListener('scroll', () => {
      document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 20);
    });

    /* ── Reveal sequence ── */
    function reveal(id, delay) {
      setTimeout(() => {
        const el = document.getElementById(id);
        if (el) el.classList.add('visible');
      }, delay);
    }

    reveal('hero-photo',     200);
    reveal('nav-logo',      1000);
    reveal('nav-left',      1200);
    reveal('nav-right',     1200);
    reveal('name-sachin',    200);
    reveal('name-shrestha',  200);
    reveal('scroll-hint',   2000);

    /* ✅ BLACK BAR HOVER — added */
    const bar     = document.getElementById('hover-bar');
    const barText = document.getElementById('hover-bar-text');

    function showBar(label) {
      barText.textContent = label;
      bar.classList.add('active');
    }
    function hideBar() {
      bar.classList.remove('active');
    }

    document.querySelectorAll('.nav-left a, .nav-right a').forEach(a => {
      a.addEventListener('mouseenter', () => showBar(a.dataset.label));
      a.addEventListener('mouseleave', hideBar);
    });

    const logo = document.getElementById('nav-logo');
    logo.addEventListener('mouseenter', () => showBar(logo.dataset.label));
    logo.addEventListener('mouseleave', hideBar);
  </script>

</body>
</html>
