<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sachin Shrestha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #EEEEEE;
      --fg: #0a0a0a;
      --muted: rgba(10,10,10,0.4);
      --nav-bg: #0e1a2e;
      --nav-text: rgba(255,255,255,0.75);
      --nav-dot: rgba(255,255,255,0.35);
    }

    html, body {
      width: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      cursor: none;
    }

    /* ── Custom cursor ── */
    #cursor-dot {
      position: fixed; top: 0; left: 0;
      width: 8px; height: 8px;
      background: var(--fg);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.12s ease;
    }
    #cursor-ring {
      position: fixed; top: 0; left: 0;
      width: 32px; height: 32px;
      border: 1.5px solid rgba(10,10,10,0.35);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s;
    }

    /* ══════════════════════════════════════
       NAV  — dark bar like Simon Sparks
    ══════════════════════════════════════ */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 200;
      background: var(--nav-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 64px;
      height: 72px;
    }

    /* subtle bottom glow line */
    nav::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 0;
      list-style: none;
    }

    .nav-group li a {
      text-decoration: none;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--nav-text);
      padding: 0 22px;
      transition: color 0.2s;
    }
    .nav-group li a:hover { color: #fff; }

    /* dot separators */
    .nav-group .dot {
      width: 4px; height: 4px;
      background: var(--nav-dot);
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* center logo */
    .nav-logo {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-logo img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      /* green logo → make it light/white for dark nav */
      filter: brightness(0) invert(1) opacity(0.85);
    }

    /* ══════════════════════════════════════
       HERO
    ══════════════════════════════════════ */
    .hero {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--bg);
      padding-top: 72px; /* nav height */
    }

    /* Portrait */
    .hero-image-wrap {
      position: relative;
      width: 340px;
      height: 500px;
      z-index: 2;
      margin-top: -20px;
    }
    .hero-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      filter: grayscale(100%) contrast(1.08);
      transition: filter 0.7s ease;
    }
    .hero-image-wrap img:hover {
      filter: grayscale(0%) contrast(1.05);
    }
    /* fade bottom of portrait into bg */
    .hero-image-wrap::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(to bottom, transparent, var(--bg));
      pointer-events: none;
    }

    /* ── BIG NAME ── */
    .hero-name {
      position: absolute;
      bottom: 44px;
      left: 0; right: 0;
      text-align: center;
      z-index: 3;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }
    .hero-name .name-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      line-height: 1;
      gap: 16px;
    }
    /* italic serif — Bodoni Moda */
    .name-serif {
      font-family: 'Bodoni Moda', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(68px, 10.5vw, 148px);
      color: var(--fg);
      letter-spacing: -0.01em;
    }
    /* upright sans — Inter light */
    .name-sans {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: clamp(68px, 10.5vw, 148px);
      color: var(--fg);
      letter-spacing: -0.04em;
    }

    /* ── SLIDE NUM left ── */
    .slide-num {
      position: absolute;
      left: 52px; top: 50%;
      transform: translateY(-50%);
      display: flex; align-items: center; gap: 14px;
      font-size: 11px; letter-spacing: 0.15em;
      color: var(--muted);
      z-index: 10;
    }
    .slide-num::after {
      content: '';
      width: 56px; height: 1px;
      background: var(--muted);
      display: block;
    }

    /* ── dot right ── */
    .slide-dot {
      position: absolute;
      right: 68px; top: 50%;
      transform: translateY(-50%);
      z-index: 10;
    }
    .slide-dot span {
      width: 28px; height: 28px;
      border: 1.5px solid rgba(10,10,10,0.25);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .slide-dot span::after {
      content: '';
      width: 5px; height: 5px;
      background: var(--fg);
      border-radius: 50%;
    }

    /* ── SCROLL hint ── */
    .scroll-hint {
      position: absolute;
      bottom: 28px; left: 52px;
      z-index: 10;
      display: flex; align-items: center; gap: 10px;
      font-size: 10px; letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .scroll-line {
      width: 1px; height: 36px;
      background: var(--muted);
      animation: scrl 1.8s ease-in-out infinite;
    }
    @keyframes scrl {
      0%,100% { transform: scaleY(1); opacity: 0.8; }
      50%      { transform: scaleY(0.35); opacity: 0.2; }
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .a1 { animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.05s both; }
    .a2 { animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.2s  both; }
    .a3 { animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.35s both; }
    .a4 { animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.5s  both; }
    .a5 { animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.65s both; }

    /* ── grain overlay ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.032'/%3E%3C/svg%3E");
    }
  </style>
</head>
<body>

  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <!-- ════════ NAV ════════ -->
  <nav class="a1">
    <!-- LEFT -->
    <ul class="nav-group">
      <li><a href="#about">About</a></li>
      <span class="dot"></span>
      <li><a href="#work">Work</a></li>
    </ul>

    <!-- CENTER LOGO -->
    <div class="nav-logo a2">
      <img src="assets/logo.png" alt="SS" />
    </div>

    <!-- RIGHT -->
    <ul class="nav-group">
      <li><a href="#shop">Shop</a></li>
      <span class="dot"></span>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- ════════ HERO ════════ -->
  <section class="hero">

    <div class="slide-num a3">01</div>
    <div class="slide-dot a3"><span></span></div>

    <!-- Portrait -->
    <div class="hero-image-wrap a2">
      <img src="assets/pp.png" alt="Sachin Shrestha" />
    </div>

    <!-- Name -->
    <div class="hero-name a4">
      <div class="name-row">
        <span class="name-serif">Sachin</span>
        <span class="name-sans">Shrestha</span>
      </div>
    </div>

    <!-- Scroll -->
    <div class="scroll-hint a5">
      <span class="scroll-line"></span>
      Scroll
    </div>

  </section>

  <script>
    /* cursor */
    const dot  = document.getElementById('cursor-dot');
    const ring = document.getElementById('cursor-ring');
    let mx=0,my=0,rx=0,ry=0;

    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      dot.style.left = mx+'px'; dot.style.top = my+'px';
    });
    (function raf(){
      rx += (mx-rx)*0.1; ry += (my-ry)*0.1;
      ring.style.left=rx+'px'; ring.style.top=ry+'px';
      requestAnimationFrame(raf);
    })();

    document.querySelectorAll('a,button').forEach(el=>{
      el.addEventListener('mouseenter',()=>{
        dot.style.transform='translate(-50%,-50%) scale(2.5)';
        ring.style.width='52px'; ring.style.height='52px';
      });
      el.addEventListener('mouseleave',()=>{
        dot.style.transform='translate(-50%,-50%) scale(1)';
        ring.style.width='32px'; ring.style.height='32px';
      });
    });
  </script>
</body>
</html>
