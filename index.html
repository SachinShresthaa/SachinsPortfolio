<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sachin Shrestha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #EEEEEE;
      --fg: #0a0a0a;
      --muted: rgba(10,10,10,0.38);
    }

    html, body {
      width: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      cursor: none;
    }

    /* ── cursor ── */
    #cursor-dot {
      position: fixed; top: 0; left: 0;
      width: 8px; height: 8px;
      background: var(--fg); border-radius: 50%;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%,-50%);
      transition: transform 0.12s ease;
    }
    #cursor-ring {
      position: fixed; top: 0; left: 0;
      width: 34px; height: 34px;
      border: 1.5px solid rgba(10,10,10,0.3);
      border-radius: 50%; pointer-events: none; z-index: 9998;
      transform: translate(-50%,-50%);
      transition: width 0.2s, height 0.2s;
    }

    /* ════════════════════════════
       NAV
    ════════════════════════════ */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 200;
      background: var(--bg);
      height: 88px;
      border-bottom: 1px solid rgba(10,10,10,0.07);

      /* THREE-column grid:
         left group | center logo | right group
         each column is 1fr so logo is truly centered */
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 60px;
    }

    nav.scrolled {
      background: rgba(238,238,238,0.93);
      backdrop-filter: blur(18px);
    }

    .nav-left {
      display: flex;
      align-items: center;
      justify-content: flex-end;   /* ← links sit CLOSE to logo */
      list-style: none;
      gap: 0;
    }

    .nav-right {
      display: flex;
      align-items: center;
      justify-content: flex-start; /* ← links sit CLOSE to logo */
      list-style: none;
      gap: 0;
    }

    .nav-left li a,
    .nav-right li a {
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--fg);
      opacity: 0.45;
      padding: 0 20px;
      transition: opacity 0.2s;
    }
    .nav-left li a:hover,
    .nav-right li a:hover { opacity: 1; }

    .nav-left .dot,
    .nav-right .dot {
      width: 3.5px; height: 3.5px;
      background: rgba(10,10,10,0.25);
      border-radius: 50%;
      flex-shrink: 0;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;   
    }
    .nav-logo img {
      width: 200px;
      height: 200px;
      object-fit: contain;
      filter: brightness(0) opacity(0.82);
      display: block;
    }
    .hero {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--bg);
      padding-top: 88px; /* = nav height */
    }

    /* portrait — centered, logo will align above it */
    .hero-image-wrap {
      position: relative;
      width: 340px;
      height: 490px;
      z-index: 2;
      /* no extra margin — stays at horizontal center */
    }
    .hero-image-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      filter: grayscale(100%) contrast(1.08);
      transition: filter 0.7s ease;
    }
    .hero-image-wrap img:hover {
      filter: grayscale(0%) contrast(1.05);
    }
    /* fade bottom into bg */
    .hero-image-wrap::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 52%;
      background: linear-gradient(to bottom, transparent, var(--bg));
      pointer-events: none;
    }

    /* ── BIG NAME ── */
    .hero-name {
      position: absolute;
      bottom: 36px; left: 0; right: 0;
      text-align: center;
      z-index: 3;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }
    .name-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      line-height: 1;
      gap: 16px;
    }

    /* Bodoni Moda — NO italic, upright */
    .name-serif {
      font-family: 'Bodoni Moda', serif;
      font-style: normal;          /* ← NOT italic */
      font-weight: 400;
      font-size: clamp(70px, 11vw, 150px);
      color: var(--fg);
      letter-spacing: -0.01em;
    }

    /* Inter light — upright */
    .name-sans {
      font-family: 'Bodoni Moda', serif;  /* same font, consistent look */
      font-style: normal;
      font-weight: 400;
      font-size: clamp(70px, 11vw, 150px);
      color: var(--fg);
      letter-spacing: -0.02em;
    }

    /* slide number left */
    .slide-num {
      position: absolute;
      left: 52px; top: 50%;
      transform: translateY(-50%);
      display: flex; align-items: center; gap: 14px;
      font-size: 11px; letter-spacing: 0.15em;
      color: var(--muted); z-index: 10;
    }
    .slide-num::after {
      content: ''; width: 52px; height: 1px;
      background: var(--muted); display: block;
    }

    /* dot right */
    .slide-dot {
      position: absolute;
      right: 64px; top: 50%;
      transform: translateY(-50%);
      z-index: 10;
    }
    .slide-dot span {
      width: 30px; height: 30px;
      border: 1.5px solid rgba(10,10,10,0.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .slide-dot span::after {
      content: ''; width: 6px; height: 6px;
      background: var(--fg); border-radius: 50%;
    }

    /* scroll hint */
    .scroll-hint {
      position: absolute;
      bottom: 24px; left: 52px; z-index: 10;
      display: flex; align-items: center; gap: 10px;
      font-size: 10px; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--muted);
    }
    .scroll-line {
      width: 1px; height: 36px;
      background: var(--muted);
      animation: scrl 1.8s ease-in-out infinite;
    }
    @keyframes scrl {
      0%,100% { transform: scaleY(1); opacity: 0.8; }
      50%      { transform: scaleY(0.3); opacity: 0.2; }
    }

    /* animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .a1 { animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.05s both; }
    .a2 { animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.2s  both; }
    .a3 { animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.35s both; }
    .a4 { animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.5s  both; }
    .a5 { animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.65s both; }

    /* grain */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    }
  </style>
</head>
<body>

  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <!-- ═══ NAV ═══ -->
  <nav id="navbar" class="a1">

    <!-- LEFT — links hug toward center logo -->
    <ul class="nav-left">
      <li><a href="#about">About</a></li>
      <span class="dot"></span>
      <li><a href="#work">Work</a></li>
    </ul>

    <!-- CENTER — logo directly above photo -->
    <div class="nav-logo a2">
      <img src="assets/logo.png" alt="SS" />
    </div>

    <!-- RIGHT — links hug toward center logo -->
    <ul class="nav-right">
      <li><a href="#shop">Shop</a></li>
      <span class="dot"></span>
      <li><a href="#contact">Contact</a></li>
    </ul>

  </nav>

  <!-- ═══ HERO ═══ -->
  <section class="hero">

    <div class="slide-num a3">01</div>
    <div class="slide-dot a3"><span></span></div>

    <!-- photo — centered = logo above it -->
    <div class="hero-image-wrap a2">
      <img src="assets/pp.png" alt="Sachin Shrestha" />
    </div>

    <!-- name — Bodoni Moda, no italic -->
    <div class="hero-name a4">
      <div class="name-row">
        <span class="name-serif">Sachin</span>
        <span class="name-sans">Shrestha</span>
      </div>
    </div>

    <div class="scroll-hint a5">
      <span class="scroll-line"></span>
      Scroll
    </div>

  </section>

  <script>
    const dot  = document.getElementById('cursor-dot');
    const ring = document.getElementById('cursor-ring');
    let mx=0,my=0,rx=0,ry=0;

    document.addEventListener('mousemove', e=>{
      mx=e.clientX; my=e.clientY;
      dot.style.left=mx+'px'; dot.style.top=my+'px';
    });
    (function raf(){
      rx+=(mx-rx)*0.1; ry+=(my-ry)*0.1;
      ring.style.left=rx+'px'; ring.style.top=ry+'px';
      requestAnimationFrame(raf);
    })();

    document.querySelectorAll('a,button').forEach(el=>{
      el.addEventListener('mouseenter',()=>{
        dot.style.transform='translate(-50%,-50%) scale(2.5)';
        ring.style.width='52px'; ring.style.height='52px';
      });
      el.addEventListener('mouseleave',()=>{
        dot.style.transform='translate(-50%,-50%) scale(1)';
        ring.style.width='34px'; ring.style.height='34px';
      });
    });

    window.addEventListener('scroll',()=>{
      document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 20);
    });
  </script>
</body>
</html>
