<head>
  <meta charset="UTF-8" />

  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

</head>
<body>

  <!-- HERO -->
  <section class="hero">
    <span class="name-word name-sachin"  id="name-sachin">SACHIN</span>
    <span class="hero-sub" id="hero-sub">BCA STUDENT</span>
    <div class="hero-image-wrap" id="hero-photo">
      <img src="assets/pp.png" alt="Sachin Shrestha" loading="eager" decoding="async" />
    </div>
    <span class="name-word name-shrestha" id="name-shrestha">SHRESTHA</span>
    <span class="hero-sub hero-sub-dev" id="hero-sub-2">SOFTWARE DEVELOPER</span>
    <span class="hero-label hero-label-left">2003</span>
    <span class="hero-label hero-label-right">10/04</span>
  </section>

  <script src="js/header.js"></script>
  <script src="js/cursor.js"></script>
  <!-- shared page transition -->
  <script src="js/transition.js"></script>

  <script>
    function reveal(id, delay) {
      setTimeout(() => {
        const el = document.getElementById(id);
        if (el) el.classList.add('visible');
      }, delay);
    }
    
    reveal('hero-photo',    200);
    reveal('name-sachin',   200);
    reveal('name-shrestha', 200);
    reveal('nav-logo',     1000);
    reveal('nav-left',     1000);
    reveal('nav-right',    1000);
    document.querySelectorAll('.hero-label').forEach(el => setTimeout(() => el.classList.add('visible'), 1400));
    reveal('hero-sub',     1400);
    reveal('hero-sub-2',   1400);
  </script>

</body>
</html>
